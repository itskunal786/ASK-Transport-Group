services:
  # ---------------------------------------------------------------------------
  # 1. ASP.NET Core Backend API (.NET 10)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ask-transport-api
    restart: unless-stopped
    ports:
      - "5208:5208"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5208
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AskTransportDb;User Id=sa;Password=AskTransport@2026Secure!;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - Redis__ConnectionString=redis:6379
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ask-network

  # ---------------------------------------------------------------------------
  # 2. React 19 Web Frontend (Nginx Alpine)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./ASK.Transport.Web
      dockerfile: Dockerfile
    container_name: ask-transport-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - api
    networks:
      - ask-network

  # ---------------------------------------------------------------------------
  # 3. Redis In-Memory Telematics & Cache Store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: ask-transport-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ask-network

  # ---------------------------------------------------------------------------
  # 4. Microsoft SQL Server 2022
  # ---------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ask-transport-db
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=AskTransport@2026Secure!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'AskTransport@2026Secure!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ask-network

networks:
  ask-network:
    driver: bridge

volumes:
  sqlserver_data:
  redis_data:
